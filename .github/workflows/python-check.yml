name: Python application checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Smoke-test Flask pages
        env:
          SECRET_KEY: ci-test-secret-key
          SHAREPLATE_DB_PATH: /tmp/shareplate-ci.db
          COOKIE_SECURE: "false"
        run: |
          python - <<'PY'
          import app
          client = app.app.test_client()
          for path in ("/", "/donate", "/donations", "/dashboard", "/register", "/login"):
              response = client.get(path)
              assert response.status_code == 200, (path, response.status_code)
              print(path, response.status_code)
          PY
      - name: Test donation workflow and demo seed
        env:
          SECRET_KEY: ci-test-secret-key
          SHAREPLATE_DB_PATH: /tmp/shareplate-tests.db
          COOKIE_SECURE: "false"
          SEED_DEMO_DATA: "false"
        run: python -m unittest discover -s tests -v
